services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: root
    MYSQL_USER: root
    MYSQL_PASSWORD: root
    ports:
      - "6900:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped

