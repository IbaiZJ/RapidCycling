spring.application.name=RapidCycling

# Share local development credentials with Docker Compose.
spring.config.import=optional:file:.env[.properties]

# DB configuration
spring.datasource.url=jdbc:mysql://localhost:3307/rapidcycling?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=rapidcycling
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
