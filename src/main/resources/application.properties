spring.application.name=RapidCycling

# Share local development credentials with Docker Compose.
spring.config.import=optional:file:.env[.properties]

# DB configuration
spring.datasource.url=jdbc:mysql://localhost:3307/rapidcycling?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=rapidcycling
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# Flyway configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Internationalization i18n
messages.basename=classpath:/i18n/messages
messages.seconds=3600
locale.default=en

# HTTPS
server.port=8443
server.ssl.enabled=false 
# server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=123456
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=mysslcert

# Logs configuration
spring.output.ansi.enabled=always
logging.level.root=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# Web socket configuration
spring.websocket.allowed-origins=*
# spring.websocket.port=8080

# Error pages (templates/error/, chosen by config/ErrorPageResolver)
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
