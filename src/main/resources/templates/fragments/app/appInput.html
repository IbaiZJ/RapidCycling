<!--/* Text-like field bound to the form's th:object. name = field of the form object. */-->
<div th:fragment="appInput(type, name, label, required)" xmlns:th="http://www.thymeleaf.org" class="w-full">
  <label
    th:for="${name}"
    th:text="${label} + (${required} ? ' *' : '')"
    class="mb-2 block text-sm font-medium text-gray-900"
  ></label>
  <input
    th:type="${type}"
    th:field="*{__${name}__}"
    th:required="${required}"
    th:classappend="${#fields.hasErrors(name)} ? 'border-red-500'"
    class="focus:border-primary focus:ring-primary block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900"
  />
  <p th:if="${#fields.hasErrors(name)}" th:errors="*{__${name}__}" class="mt-1 text-sm text-red-600"></p>
</div>
