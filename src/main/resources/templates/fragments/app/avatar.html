<!--/* Round avatar with the first letter of the name. size = Tailwind classes, e.g. 'h-10 w-10'. */-->
<div
  th:fragment="avatar(name, size)"
  xmlns:th="http://www.thymeleaf.org"
  th:classappend="${size}"
  class="flex items-center justify-center overflow-hidden rounded-full bg-gray-200 font-semibold text-gray-500"
>
  <span th:text="${#strings.toUpperCase(#strings.substring(name, 0, 1))}"></span>
</div>
