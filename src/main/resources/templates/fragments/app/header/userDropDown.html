<div
  th:fragment="userDropDown"
  id="userDropDown"
  xmlns:th="http://www.thymeleaf.org"
  class="absolute top-12 right-0 z-50 hidden w-64 overflow-hidden rounded-xl bg-white shadow-xl ring-1 ring-gray-200"
>
  <div class="flex items-center gap-3 border-b border-gray-100 bg-gray-50 px-4 py-3">
    <div th:replace="~{fragments/app/avatar :: avatar(${#authentication.name}, 'h-10 w-10')}"></div>
    <p th:text="${#authentication.name}" class="truncate text-sm font-medium text-gray-900"></p>
  </div>

  <div class="divide-y divide-gray-100">
    <form th:action="@{/logout}" method="post">
      <button
        type="submit"
        th:text="#{app.header.userDropDown.signOut}"
        class="flex w-full cursor-pointer px-4 py-3 text-left text-sm text-red-600 transition hover:bg-red-50"
      ></button>
    </form>
  </div>
</div>
